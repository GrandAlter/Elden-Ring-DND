<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elden Ring D&D Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'serif': ['Cinzel', 'serif'],
                        'sans': ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'er-gold': '#d4af37',
                        'er-dark': '#1a1a1a',
                        'er-panel': '#242424',
                        'er-border': '#3d3d3d',
                        'rarity-common': '#b0b0b0',
                        'rarity-uncommon': '#7da36e',
                        'rarity-rare': '#5b85aa',
                        'rarity-very-rare': '#8a5a9e',
                        'rarity-legendary': '#c49a3f',
                        'magic-sorcery': '#5b85aa',
                        'magic-incantation': '#c49a3f',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f0f0f;
            background-image: radial-gradient(circle at 50% 0%, #2a2a2a 0%, #0f0f0f 70%);
            background-attachment: fixed;
            overflow-x: hidden;
        }
        /* Hide scrollbar for tabs but keep functionality */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Custom scrollbar for main areas */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #d4af37; 
            border-radius: 4px;
        }
        .tab-active {
            border-bottom: 2px solid #d4af37;
            color: #d4af37;
        }
        .tab-inactive {
            border-bottom: 2px solid transparent;
            color: #78716c;
            transition: all 0.2s;
        }
        .tab-inactive:hover {
            color: #d4af37;
            opacity: 0.8;
        }
        .roll-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            background-color: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 0.25rem;
            padding: 0.1rem 0.4rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0 0.2rem;
            vertical-align: middle;
        }
        .roll-btn:hover {
            background-color: rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
        }
        .roll-btn svg {
            width: 14px;
            height: 14px;
        }
        .linkified-text {
            color: #d4af37;
            text-decoration: underline;
            text-decoration-color: rgba(212, 175, 55, 0.5);
            text-underline-offset: 4px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .linkified-text:hover {
            color: #ffffff;
            text-decoration-color: #ffffff;
        }
        .modal-enter {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="text-stone-300 font-sans min-h-screen flex flex-col lg:flex-row">

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto relative z-0">
        <header class="py-3 px-4 sm:px-6 border-b border-er-border bg-er-dark/95 backdrop-blur-md sticky top-0 z-20 shadow-lg flex flex-col gap-3">
            
            <!-- Top Row: Title & Mobile Toggle -->
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-2 sm:gap-3">
                    <h1 class="text-lg sm:text-xl text-er-gold font-serif font-bold tracking-wide truncate">Elden Ring D&D</h1>
                    <span class="hidden sm:inline-block text-stone-500 text-xs uppercase tracking-widest border-l border-stone-700 pl-3">Database</span>
                </div>
                <!-- Mobile Stats Toggle Button -->
                <button id="toggleStatsBtn" class="lg:hidden flex items-center gap-2 bg-er-panel border border-er-border px-3 py-1.5 rounded text-xs text-er-gold hover:text-white hover:border-er-gold transition-colors shadow-sm focus:outline-none">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    Stats
                </button>
            </div>

            <!-- Navigation Tabs -->
            <div class="flex gap-4 sm:gap-6 font-serif text-xs sm:text-sm tracking-widest uppercase overflow-x-auto hide-scrollbar whitespace-nowrap pb-1 -mx-4 px-4 sm:mx-0 sm:px-0">
                <button id="tabWeapons" class="pb-1 tab-active shrink-0">Armory</button>
                <button id="tabAshes" class="pb-1 tab-inactive shrink-0">Ashes of War</button>
                <button id="tabSpells" class="pb-1 tab-inactive shrink-0">Grimoire</button>
                <button id="tabWondrous" class="pb-1 tab-inactive shrink-0">Relics & Items</button>
                <button id="tabBooks" class="pb-1 tab-inactive shrink-0">Tomes & Recipes</button>
                <button id="tabMaterials" class="pb-1 tab-inactive shrink-0">Materials</button>
            </div>
            
            <!-- Search and Sort Row -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 w-full items-center">
                <div class="relative w-full">
                    <input type="text" id="searchInput" placeholder="Search entries..." class="w-full bg-er-panel border border-er-border rounded py-2 sm:py-1.5 pl-3 pr-8 text-sm sm:text-xs text-stone-200 focus:outline-none focus:border-er-gold focus:ring-1 focus:ring-er-gold transition-colors">
                    <svg class="w-4 h-4 absolute right-2.5 top-2.5 sm:top-1.5 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                
                <div class="flex items-center gap-2 w-full">
                    <label for="sortSelect" class="text-stone-400 font-serif text-xs whitespace-nowrap hidden sm:block">Sort:</label>
                    <select id="sortSelect" class="w-full bg-er-panel border border-er-border rounded py-2 sm:py-1.5 px-2 text-sm sm:text-xs text-stone-200 focus:outline-none focus:border-er-gold transition-colors appearance-none cursor-pointer">
                        <option value="alpha_asc">Alphabetical (A-Z)</option>
                        <option value="alpha_desc">Alphabetical (Z-A)</option>
                        <!-- Dynamic options added by JS -->
                    </select>
                </div>
            </div>

            <!-- Dynamic Filters -->
            <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-er-border/50">
                <span class="text-stone-500 font-serif text-xs uppercase tracking-widest hidden md:block mr-1">Filter:</span>
                
                <select id="filterLetter" class="flex-1 min-w-[80px] sm:flex-none bg-er-panel border border-er-border rounded py-2 sm:py-1 px-2 text-xs text-stone-300 focus:outline-none focus:border-er-gold transition-colors appearance-none cursor-pointer">
                    <option value="all">Any Letter</option>
                    <!-- Generated by JS -->
                </select>

                <select id="filterType" class="flex-1 min-w-[120px] sm:flex-none bg-er-panel border border-er-border rounded py-2 sm:py-1 px-2 text-xs text-stone-300 focus:outline-none focus:border-er-gold transition-colors appearance-none cursor-pointer">
                    <option value="all">Any Category</option>
                    <!-- Generated by JS -->
                </select>

                <select id="filterRarityUnique" class="flex-1 min-w-[140px] sm:flex-none bg-er-panel border border-er-border rounded py-2 sm:py-1 px-2 text-xs text-stone-300 focus:outline-none focus:border-er-gold transition-colors appearance-none cursor-pointer">
                    <option value="all">Any Rarity</option>
                    <!-- Generated by JS -->
                </select>

                <select id="filterAffinity" class="flex-1 min-w-[100px] sm:flex-none bg-er-panel border border-er-border rounded py-2 sm:py-1 px-2 text-xs text-stone-300 focus:outline-none focus:border-er-gold transition-colors appearance-none cursor-pointer">
                    <option value="all">Any Affinity</option>
                    <option value="strength">Strength</option>
                    <option value="dexterity">Dexterity</option>
                    <option value="constitution">Constitution</option>
                    <option value="intelligence">Intelligence</option>
                    <option value="wisdom">Wisdom</option>
                    <option value="charisma">Charisma</option>
                    <option value="none">None</option>
                </select>
                
                <select id="filterSchool" class="hidden flex-1 min-w-[120px] sm:flex-none bg-er-panel border border-er-border rounded py-2 sm:py-1 px-2 text-xs text-stone-300 focus:outline-none focus:border-er-gold transition-colors appearance-none cursor-pointer">
                    <option value="all">Any School</option>
                </select>

                <select id="filterLevel" class="hidden flex-1 min-w-[100px] sm:flex-none bg-er-panel border border-er-border rounded py-2 sm:py-1 px-2 text-xs text-stone-300 focus:outline-none focus:border-er-gold transition-colors appearance-none cursor-pointer">
                    <option value="all">Any Level</option>
                </select>
                
                <button id="resetFilters" class="w-full sm:w-auto text-xs text-stone-400 hover:text-er-gold transition-colors underline decoration-stone-600 hover:decoration-er-gold underline-offset-2 py-2 sm:py-1 text-center mt-1 sm:mt-0 sm:ml-auto">Reset All</button>
            </div>
            
            <div id="itemCount" class="text-xs text-stone-500 text-center sm:text-left mt-1 sm:mt-0"></div>
        </header>

        <main class="flex-1 p-4 sm:p-6 w-full max-w-7xl mx-auto">
            <!-- Grid scales from 1 col (mobile) to 4 cols (desktop) -->
            <div id="gridContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6">
                <!-- Cards injected via JavaScript -->
            </div>
            
            <div id="noResults" class="hidden text-center py-20">
                <h2 class="text-xl sm:text-2xl font-serif text-stone-500">No entries found in the archives.</h2>
            </div>
        </main>
    </div>

    <!-- Responsive Stats Sidebar -->
    <aside id="stats-sidebar" class="fixed inset-y-0 right-0 w-80 max-w-[85vw] bg-[#0f0f0f] border-l border-er-border transform translate-x-full lg:translate-x-0 lg:static lg:flex lg:flex-col lg:w-80 h-full shadow-2xl flex flex-col z-[70] transition-transform duration-300 ease-in-out">
        
        <div class="p-4 border-b border-er-border flex justify-between items-center bg-er-dark sticky top-0 z-10">
            <h2 class="text-er-gold font-serif font-bold text-lg">Character</h2>
            <!-- Close button visible only on mobile -->
            <button id="closeStatsBtn" class="lg:hidden text-stone-400 hover:text-white bg-er-panel p-1.5 rounded transition-colors focus:outline-none">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="p-4 flex-1 overflow-y-auto hide-scrollbar space-y-5">
            <!-- Level Input -->
            <div class="flex items-center justify-between bg-er-panel p-3 rounded-lg border border-er-border shadow-inner">
                <span class="text-sm uppercase tracking-widest text-stone-400 font-bold">Level</span>
                <input type="number" id="char-level" min="1" max="20" value="1" class="w-16 bg-er-dark border border-stone-600 rounded px-2 py-1 text-white text-center font-mono focus:outline-none focus:border-er-gold">
            </div>

            <!-- Stats Inputs -->
            <div class="space-y-2">
                <h3 class="text-xs uppercase tracking-widest text-stone-500 font-bold mb-2 ml-1">Attributes</h3>
                
                <div class="flex items-center justify-between bg-er-panel p-2 px-3 rounded border border-er-border">
                    <span class="text-xs uppercase tracking-widest text-stone-400 font-bold w-16">STR</span>
                    <input type="number" id="stat-str" min="1" max="30" value="10" class="w-12 bg-transparent text-white text-center border-b border-stone-600 focus:outline-none focus:border-er-gold font-mono">
                </div>
                <div class="flex items-center justify-between bg-er-panel p-2 px-3 rounded border border-er-border">
                    <span class="text-xs uppercase tracking-widest text-stone-400 font-bold w-16">DEX</span>
                    <input type="number" id="stat-dex" min="1" max="30" value="10" class="w-12 bg-transparent text-white text-center border-b border-stone-600 focus:outline-none focus:border-er-gold font-mono">
                </div>
                <div class="flex items-center justify-between bg-er-panel p-2 px-3 rounded border border-er-border">
                    <span class="text-xs uppercase tracking-widest text-stone-400 font-bold w-16">CON</span>
                    <input type="number" id="stat-con" min="1" max="30" value="10" class="w-12 bg-transparent text-white text-center border-b border-stone-600 focus:outline-none focus:border-er-gold font-mono">
                </div>
                <div class="flex items-center justify-between bg-er-panel p-2 px-3 rounded border border-er-border">
                    <span class="text-xs uppercase tracking-widest text-stone-400 font-bold w-16">INT</span>
                    <input type="number" id="stat-int" min="1" max="30" value="10" class="w-12 bg-transparent text-white text-center border-b border-stone-600 focus:outline-none focus:border-er-gold font-mono">
                </div>
                <div class="flex items-center justify-between bg-er-panel p-2 px-3 rounded border border-er-border">
                    <span class="text-xs uppercase tracking-widest text-stone-400 font-bold w-16">WIS</span>
                    <input type="number" id="stat-wis" min="1" max="30" value="10" class="w-12 bg-transparent text-white text-center border-b border-stone-600 focus:outline-none focus:border-er-gold font-mono">
                </div>
                <div class="flex items-center justify-between bg-er-panel p-2 px-3 rounded border border-er-border">
                    <span class="text-xs uppercase tracking-widest text-stone-400 font-bold w-16">CHA</span>
                    <input type="number" id="stat-cha" min="1" max="30" value="10" class="w-12 bg-transparent text-white text-center border-b border-stone-600 focus:outline-none focus:border-er-gold font-mono">
                </div>
            </div>

            <div class="space-y-2 pt-2">
                <h3 class="text-xs uppercase tracking-widest text-stone-500 font-bold mb-2 ml-1">Spellcasting</h3>
                <select id="spellcasting-stat" class="w-full bg-er-panel border border-er-border rounded py-2 px-3 text-sm text-stone-300 focus:outline-none focus:border-er-gold">
                    <option value="int">Intelligence</option>
                    <option value="wis">Wisdom</option>
                    <option value="cha">Charisma</option>
                </select>
            </div>
        </div>

        <!-- Dice Roll Log -->
        <div id="dice-log" class="border-t border-er-border bg-er-dark flex flex-col transition-all duration-300 h-64 mt-auto">
            <div id="dice-log-header" class="p-3 bg-er-panel border-b border-stone-800 flex justify-between items-center cursor-pointer hover:bg-stone-800 transition-colors">
                <span class="text-xs font-bold uppercase tracking-widest text-stone-400 flex items-center gap-2">
                    <svg class="w-4 h-4 text-er-gold" fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7.5 18c-.83 0-1.5-.67-1.5-1.5S6.67 15 7.5 15s1.5.67 1.5 1.5S8.33 18 7.5 18zm0-9C6.67 9 6 8.33 6 7.5S6.67 6 7.5 6 9 6.67 9 7.5 8.33 9 7.5 9zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm0-9c-.83 0-1.5-.67-1.5-1.5S15.67 6 16.5 6s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                    Roll Log
                </span>
                <span id="toggle-log-icon" class="text-stone-500 font-mono text-lg">[-]</span>
            </div>
            <div id="dice-log-content" class="p-3 overflow-y-auto flex-1 space-y-2 text-sm font-mono flex flex-col">
                <div class="text-stone-600 italic text-center mt-auto text-xs pb-2">Awaiting your command...</div>
            </div>
        </div>
    </aside>

    <!-- Overlay for mobile sidebar -->
    <div id="mobile-overlay" class="fixed inset-0 bg-black/60 z-[60] hidden lg:hidden backdrop-blur-sm transition-opacity opacity-0"></div>

    <!-- Detail Modal -->
    <div id="itemModal" class="fixed inset-0 z-[80] hidden flex items-center justify-center p-2 sm:p-4">
        <div id="modalBackdrop" class="absolute inset-0 bg-black/80 backdrop-blur-sm transition-opacity"></div>
        <div class="relative bg-er-dark border border-er-border rounded-xl shadow-2xl w-full max-w-[95vw] sm:max-w-xl md:max-w-2xl max-h-[90vh] overflow-hidden flex flex-col modal-enter">
            
            <button id="closeModalBtn" class="absolute top-3 right-3 sm:top-4 sm:right-4 text-stone-400 hover:text-white bg-er-panel rounded-full p-2 transition-colors z-10 shadow-md focus:outline-none border border-stone-700 hover:border-er-gold">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <!-- Modal Content (Scrollable Inner) -->
            <div class="p-4 sm:p-6 md:p-8 overflow-y-auto hide-scrollbar w-full">
                
                <div class="mb-4 sm:mb-6 border-b border-er-border pb-4 pr-8">
                    <h2 id="modalTitle" class="text-2xl sm:text-3xl font-serif font-bold text-er-gold mb-2 leading-tight">Item Name</h2>
                    <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 text-[10px] sm:text-xs font-semibold tracking-wide uppercase">
                        <span id="modalLevel" class="text-stone-300 hidden">Level</span>
                        <span id="modalLevelDot" class="text-stone-600 hidden">•</span>
                        <span id="modalType" class="bg-er-panel px-2 py-0.5 sm:px-3 sm:py-1 rounded text-stone-300 border border-stone-700">Type</span>
                        <span id="modalRarity" class="px-2 py-0.5 sm:px-3 sm:py-1 rounded border bg-er-panel font-semibold">Rarity</span>
                        <span id="modalAffinity" class="bg-er-panel px-2 py-0.5 sm:px-3 sm:py-1 rounded text-stone-300 border border-stone-700">Affinity</span>
                        <span id="modalSchoolDot" class="text-stone-600 hidden">•</span>
                        <span id="modalSchool" class="text-stone-400 hidden">School</span>
                    </div>
                </div>

                <!-- Dynamic Action Bar (Roll Attacks/Saves) -->
                <div id="modalDynamicStats" class="mb-4 sm:mb-6"></div>

                <!-- Spell Specific Stats -->
                <div id="modalSpellStats" class="grid grid-cols-2 gap-3 mb-6 bg-er-panel p-3 sm:p-4 rounded-lg border border-er-border text-xs sm:text-sm hidden">
                    <div class="flex flex-col"><span class="text-stone-500 font-bold uppercase tracking-wider text-[10px]">Casting Time</span> <span id="modalTime" class="text-stone-300 font-medium mt-0.5"></span></div>
                    <div class="flex flex-col"><span class="text-stone-500 font-bold uppercase tracking-wider text-[10px]">Range</span> <span id="modalRange" class="text-stone-300 font-medium mt-0.5"></span></div>
                    <div class="flex flex-col"><span class="text-stone-500 font-bold uppercase tracking-wider text-[10px]">Components</span> <span id="modalComponents" class="text-stone-300 font-medium mt-0.5"></span></div>
                    <div class="flex flex-col"><span class="text-stone-500 font-bold uppercase tracking-wider text-[10px]">Duration</span> <span id="modalDuration" class="text-stone-300 font-medium mt-0.5"></span></div>
                </div>

                <div class="mb-6">
                    <div id="modalDescription" class="text-stone-300 text-sm leading-relaxed space-y-3 sm:space-y-4 whitespace-pre-wrap hidden"></div>
                    <div id="modalSpellDescription" class="text-stone-300 text-sm leading-relaxed space-y-3 sm:space-y-4 whitespace-pre-wrap hidden"></div>
                    
                    <div id="modalPassiveContainer" class="hidden mt-4 bg-[#1a1712] border-l-4 border-er-gold p-3 sm:p-4 rounded-r">
                        <h4 class="text-er-gold font-serif font-semibold mb-1 sm:mb-2 text-sm sm:text-base" id="modalPassiveTitle">Passive Effect</h4>
                        <p id="modalPassive" class="text-stone-300 text-xs sm:text-sm leading-relaxed"></p>
                    </div>
                </div>

                <div id="modalSkillContainer" class="bg-[#1e1a13] border border-[#d4af37]/30 rounded-lg p-4 sm:p-5 hidden mt-4">
                    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 mb-3">
                        <h3 class="text-lg sm:text-xl font-serif text-white flex items-center gap-2">
                            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-er-gold shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path></svg>
                            <span id="modalSkillName" class="break-words">Skill Name</span>
                        </h3>
                        <span id="modalSkillSp" class="bg-blue-900/50 text-blue-200 border border-blue-500/50 px-2 py-1 rounded text-[10px] sm:text-xs font-bold uppercase tracking-wider self-start sm:self-auto shrink-0">0 SP</span>
                    </div>
                    <p id="modalSkillDesc" class="text-stone-300 text-xs sm:text-sm leading-relaxed"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Data Files - Ensure these files exist in the same directory -->
    <script src="data_weapons.js"></script>
    <script src="data_ashes.js"></script>
    <script src="data_spells.js"></script>
    <script src="data_wondrous.js"></script>
    <script src="data_books.js"></script>
    <script src="data_materials.js"></script>

    <!-- Inline Application Logic -->
    <script>
        // --- CORE STATE ---
        let currentTab = 'weapons';
        let currentOpenItem = null;

        // --- SAFE DATA LOADING ---
        // Prevents crashes if a data file fails to load or is missing.
        const safeWeapons = typeof weapons !== 'undefined' ? weapons : [];
        const safeAshes = typeof ashesOfWar !== 'undefined' ? ashesOfWar : [];
        const safeSpells = typeof spells !== 'undefined' ? spells : [];
        const safeWondrous = typeof wondrousItems !== 'undefined' ? wondrousItems : [];
        const safeBooks = typeof books !== 'undefined' ? books : [];
        const safeMaterials = typeof materials !== 'undefined' ? materials : [];

        // --- CHARACTER STATS ---

        function logDiceRoll(title, resultStr, total, isCrit = false) {
            const logContent = document.getElementById('dice-log-content');
            if (!logContent) return;

            if (logContent.innerHTML.includes('Awaiting your command')) {

        window.executeRoll = function(diceStr, bonusStr, label) {
            const diceRegex = /(\d+)d(\d+)/g;
            let match;
            let total = 0;
            let rolls = [];
            
            while ((match = diceRegex.exec(diceStr)) !== null) {
                const count = parseInt(match[1]);
                const sides = parseInt(match[2]);
                for (let i = 0; i < count; i++) {
                    const roll = Math.floor(Math.random() * sides) + 1;
                    rolls.push(roll);
                    total += roll;
                }
            }
            
            const bonus = bonusStr ? parseInt(bonusStr.replace('+', '')) : 0;
            total += bonus;
            
            const resultStr = `[${rolls.join(', ')}] ${bonus ? (bonus > 0 ? '+ ' + bonus : '- ' + Math.abs(bonus)) : ''}`;
            const isCrit = diceStr === '1d20' && rolls[0] === 20;
            
            logDiceRoll(label, resultStr, total, isCrit);
        };

        function parseDiceNotation(text) {
            if (!text) return "";
            let parsedText = text;
            let tokens = []; 
            
            const svgIcon = `<svg fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7.5 18c-.83 0-1.5-.67-1.5-1.5S6.67 15 7.5 15s1.5.67 1.5 1.5S8.33 18 7.5 18zm0-9C6.67 9 6 8.33 6 7.5S6.67 6 7.5 6 9 6.67 9 7.5 8.33 9 7.5 9zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm0-9c-.83 0-1.5-.67-1.5-1.5S15.67 6 16.5 6s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>`;

            const avgDamageRegex = /\b\d+\s*\((\d+d\d+)([\+\-]\d+)?\)\s*([a-zA-Z]+)\s*damage\b/gi;
            parsedText = parsedText.replace(avgDamageRegex, (match, dice, bonus, type, offset, string) => {
                const before = string.substring(0, offset);
                if (before.lastIndexOf('<') > before.lastIndexOf('>')) return match; 

                const cleanBonus = bonus ? bonus : '';
                const safeLabel = `${type} damage`.replace(/'/g, "\\'");
                const btnHtml = `<button class="roll-btn" onclick="executeRoll('${dice}', '${cleanBonus}', '${safeLabel}')" title="Roll ${dice}${cleanBonus}">${svgIcon} ${match}</button>`;
                
                const tokenId = `__DICE_TOKEN_${tokens.length}__`;
                tokens.push(btnHtml);
                return tokenId;
            });

            const simpleDiceRegex = /(?<!\()\b(\d+d\d+)([\+\-]\d+)?\b(?!\))/gi;
            parsedText = parsedText.replace(simpleDiceRegex, (match, dice, bonus, offset, string) => {
                const before = string.substring(0, offset);
                if (before.lastIndexOf('<') > before.lastIndexOf('>')) return match; 
                
                const cleanBonus = bonus ? bonus : '';
                const btnHtml = `<button class="roll-btn" onclick="executeRoll('${dice}', '${cleanBonus}', 'Roll')" title="Roll ${match}">${svgIcon} ${match}</button>`;
                
                const tokenId = `__DICE_TOKEN_${tokens.length}__`;
                tokens.push(btnHtml);
                return tokenId;
            });

            tokens.forEach((html, index) => {
                parsedText = parsedText.replace(`__DICE_TOKEN_${index}__`, html);
            });

            return parsedText;
        }

        // --- LINKIFY ENGINE ---
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function linkifyText(text) {

            let linkedText = text;

            safeWondrous.forEach(item => {

                if (regex.test(linkedText)) {

                }
            });

            safeBooks.forEach(book => {
                const escapedName = escapeRegExp(book.name);
                const regex = new RegExp(`(?<=\\W|^)${escapedName}(?=\\W|$)`, "gi");
                if (regex.test(linkedText)) {
                    const safeName = book.name.replace(/'/g, "\\'");
                    linkItems.push({ name: book.name, replacement: `<span onclick="jumpToBook('${safeName}')" class="linkified-text" title="View Book Details">$&</span>`});
                }
            });

            safeMaterials.forEach(mat => {
                const escapedName = escapeRegExp(mat.name);
                const regex = new RegExp(`(?<=\\W|^)${escapedName}(?=\\W|$)`, "gi");
                if (regex.test(linkedText)) {
                    const safeName = mat.name.replace(/'/g, "\\'");
                    linkItems.push({ name: mat.name, replacement: `<span onclick="jumpToMaterial('${safeName}')" class="linkified-text" title="View Material Details">$&</span>`});
                }
            });

            linkItems.sort((a, b) => b.name.length - a.name.length);
            linkItems.forEach(item => {
                const escapedName = escapeRegExp(item.name);
                const regex = new RegExp(`(?<=\\W|^)${escapedName}(?=\\W|$)`, "gi");
                linkedText = linkedText.replace(regex, (match, offset, string) => {
                    const before = string.substring(0, offset);
                    if (before.includes('<span') && !before.substring(before.lastIndexOf('<span')).includes('</span>')) return match; 
                    return item.replacement.replace('$&', match);
                });
            });

            return linkedText;
        }

        function isWeaponCompatibleWithAsh(weaponType, compatibilityStr) {
            const compLower = compatibilityStr.toLowerCase();
            if (compLower.includes("none") || compLower.includes("unique")) return false;
            if (compLower.includes(weaponType.toLowerCase())) return true;

            const props = weaponTypeProperties[weaponType.toLowerCase()];
            if (!props) return false;

            const conditions = compLower.replace(/ or /g, ',').split(',').map(s => s.trim());
            const isPropertyBased = conditions.some(c => ["melee", "ranged", "shield", "shields only"].includes(c));
            
            if (isPropertyBased) {
                return conditions.every(cond => {
                    if (cond === "shields only" || cond === "shield") return props.includes("shield");
                    if (cond === "melee") return props.includes("melee");
                    if (cond === "ranged") return props.includes("ranged");
                    if (cond.startsWith("non-")) return !props.includes(cond.replace("non-", ""));
                    return props.includes(cond);
                });
            }
            return false;
        }

        function filterAndSort() {
            const gridContainer = document.getElementById('gridContainer');
            const searchInput = document.getElementById('searchInput');
            if (!gridContainer || !searchInput) return;

            const query = searchInput.value.toLowerCase();
            const sortVal = document.getElementById('sortSelect').value;
            const letterVal = document.getElementById('filterLetter').value;
            const typeVal = document.getElementById('filterType') ? document.getElementById('filterType').value : 'all';
            const rarityVal = document.getElementById('filterRarityUnique') ? document.getElementById('filterRarityUnique').value : 'all';
            const affinVal = document.getElementById('filterAffinity') ? document.getElementById('filterAffinity').value : 'all';
            
            let filtered = [];

            if (currentTab === 'weapons') {
                filtered = safeWeapons.filter(w => {
                    let match = w.name.toLowerCase().includes(query) || w.type.toLowerCase().includes(query) || (w.skill && w.skill.name.toLowerCase().includes(query));
                    if (!match) return false;
                    if (letterVal !== 'all' && !w.name.toLowerCase().startsWith(letterVal)) return false;
                    if (typeVal !== 'all' && w.type.toLowerCase() !== typeVal) return false;
                    
                    if (rarityVal !== 'all') {
                        const isUnique = !['common', 'uncommon'].includes(w.rarity.toLowerCase());
                        if (rarityVal === 'ashable' && isUnique) return false;
                        if (rarityVal === 'unique' && !isUnique) return false;
                        if (rarityVal !== 'ashable' && rarityVal !== 'unique' && w.rarity.toLowerCase() !== rarityVal) return false;
                    }
                    if (affinVal !== 'all' && w.affinity.toLowerCase() !== affinVal) return false;
                    return true;
                });

                filtered.sort((a, b) => {
                    if (sortVal === 'alpha_asc') return a.name.localeCompare(b.name);
                    if (sortVal === 'alpha_desc') return b.name.localeCompare(a.name);
                    if (sortVal === 'rarity_desc') return (rarityWeights[b.rarity.toLowerCase()] || 0) - (rarityWeights[a.rarity.toLowerCase()] || 0);
                    if (sortVal === 'rarity_asc') return (rarityWeights[a.rarity.toLowerCase()] || 0) - (rarityWeights[b.rarity.toLowerCase()] || 0);
                    if (sortVal === 'type_asc') return a.type.localeCompare(b.type);
                    if (sortVal === 'affinity_asc') return a.affinity.localeCompare(b.affinity);
                    return 0;
                });

            } else if (currentTab === 'ashes') {
                filtered = safeAshes.filter(a => {
                    let match = a.name.toLowerCase().includes(query) || a.compatibility.toLowerCase().includes(query) || a.description.toLowerCase().includes(query);
                    if (!match) return false;
                    if (letterVal !== 'all' && !a.name.toLowerCase().startsWith(letterVal)) return false;
                    if (typeVal !== 'all' && !isWeaponCompatibleWithAsh(typeVal, a.compatibility)) return false;
                    
                    if (rarityVal !== 'all') { // For ashes, rarity filter is uniqueness
                        const isUnique = a.compatibility.toLowerCase().includes('unique');
                        if (rarityVal === 'unique' && !isUnique) return false;
                        if (rarityVal === 'non-unique' && isUnique) return false;
                    }
                    if (affinVal !== 'all' && a.affinity.toLowerCase() !== affinVal) return false;
                    return true;
                });

                filtered.sort((a, b) => {
                    if (sortVal === 'alpha_asc') return a.name.localeCompare(b.name);
                    if (sortVal === 'alpha_desc') return b.name.localeCompare(a.name);
                    if (sortVal === 'cost_desc') return b.sp - a.sp;
                    if (sortVal === 'cost_asc') return a.sp - b.sp;
                    if (sortVal === 'compat_asc') return a.compatibility.localeCompare(b.compatibility);
                    if (sortVal === 'affinity_asc') return a.affinity.localeCompare(b.affinity);
                    return 0;
                });

            } else if (currentTab === 'spells') {
                const schoolVal = document.getElementById('filterSchool') ? document.getElementById('filterSchool').value : 'all';
                const levelVal = document.getElementById('filterLevel') ? document.getElementById('filterLevel').value : 'all';

                filtered = safeSpells.filter(s => {
                    let match = s.name.toLowerCase().includes(query) || s.school.toLowerCase().includes(query) || s.description.toLowerCase().includes(query);
                    if (!match) return false;
                    if (letterVal !== 'all' && !s.name.toLowerCase().startsWith(letterVal)) return false;
                    if (typeVal !== 'all' && s.type.toLowerCase() !== typeVal) return false;
                    if (schoolVal !== 'all' && s.school.toLowerCase() !== schoolVal) return false;
                    if (levelVal !== 'all' && s.level.toString().toLowerCase() !== levelVal) return false;
                    return true;
                });

                filtered.sort((a, b) => {
                    if (sortVal === 'alpha_asc') return a.name.localeCompare(b.name);
                    if (sortVal === 'alpha_desc') return b.name.localeCompare(a.name);
                    if (sortVal === 'type_asc') return a.type.localeCompare(b.type);
                    if (sortVal === 'school_asc') return a.school.localeCompare(b.school);
                    if (sortVal === 'level_asc' || sortVal === 'level_desc') {
                        const lvlA = a.level === 'Cantrip' ? -1 : parseInt(a.level);
                        const lvlB = b.level === 'Cantrip' ? -1 : parseInt(b.level);
                        return sortVal === 'level_asc' ? lvlA - lvlB : lvlB - lvlA;
                    }
                    return 0;
                });
                
            } else if (currentTab === 'wondrous') {
                filtered = safeWondrous.filter(w => {
                    let match = w.name.toLowerCase().includes(query) || w.type.toLowerCase().includes(query) || w.description.toLowerCase().includes(query);
                    if (!match) return false;
                    if (letterVal !== 'all' && !w.name.toLowerCase().startsWith(letterVal)) return false;
                    if (typeVal !== 'all' && w.type.toLowerCase() !== typeVal) return false;
                    if (rarityVal !== 'all' && w.rarity.toLowerCase() !== rarityVal) return false;
                    return true;
                });

                filtered.sort((a, b) => {
                    if (sortVal === 'alpha_asc') return a.name.localeCompare(b.name);
                    if (sortVal === 'alpha_desc') return b.name.localeCompare(a.name);
                    if (sortVal === 'rarity_desc') return (rarityWeights[b.rarity.toLowerCase()] || 0) - (rarityWeights[a.rarity.toLowerCase()] || 0);
                    if (sortVal === 'rarity_asc') return (rarityWeights[a.rarity.toLowerCase()] || 0) - (rarityWeights[b.rarity.toLowerCase()] || 0);
                    if (sortVal === 'type_asc') return a.type.localeCompare(b.type);
                    return 0;
                });
                
            } else if (currentTab === 'books') {
                filtered = safeBooks.filter(b => {
                    let match = b.name.toLowerCase().includes(query) || b.description.toLowerCase().includes(query);
                    if (!match) return false;
                    if (letterVal !== 'all' && !b.name.toLowerCase().startsWith(letterVal)) return false;
                    if (typeVal !== 'all' && b.type.toLowerCase() !== typeVal) return false;
                    return true;
                });

                filtered.sort((a, b) => {
                    if (sortVal === 'alpha_asc') return a.name.localeCompare(b.name);
                    if (sortVal === 'alpha_desc') return b.name.localeCompare(a.name);
                    if (sortVal === 'type_asc') return a.type.localeCompare(b.type) || a.name.localeCompare(b.name);
                    if (sortVal === 'type_desc') return b.type.localeCompare(a.type) || a.name.localeCompare(b.name);
                    return 0;
                });
                
            } else if (currentTab === 'materials') {
                filtered = safeMaterials.filter(m => {
                    let match = m.name.toLowerCase().includes(query) || m.description.toLowerCase().includes(query);
                    if (!match) return false;
                    if (letterVal !== 'all' && !m.name.toLowerCase().startsWith(letterVal)) return false;
                    if (rarityVal !== 'all' && m.rarity.toLowerCase() !== rarityVal) return false;
                    return true;
                });

                filtered.sort((a, b) => {
                    if (sortVal === 'alpha_asc') return a.name.localeCompare(b.name);
                    if (sortVal === 'alpha_desc') return b.name.localeCompare(a.name);
                    if (sortVal === 'rarity_desc') return (rarityWeights[b.rarity.toLowerCase()] || 0) - (rarityWeights[a.rarity.toLowerCase()] || 0);
                    if (sortVal === 'rarity_asc') return (rarityWeights[a.rarity.toLowerCase()] || 0) - (rarityWeights[b.rarity.toLowerCase()] || 0);
                    return 0;
                });
            }

            const itemCount = document.getElementById('itemCount');
            if (itemCount) {
                const typeName = currentTab === 'weapons' ? 'Armaments' : currentTab === 'ashes' ? 'Ashes of War' : currentTab === 'wondrous' ? 'Relics & Items' : currentTab === 'books' ? 'Tomes & Recipes' : currentTab === 'materials' ? 'Materials' : 'Spells';
                itemCount.innerHTML = `Showing <span class="text-er-gold font-bold text-sm">${filtered.length}</span> ${typeName}`;
            }

            renderItems(filtered);
        }

        function openModal(item) {
            const modal = document.getElementById('itemModal');
            if (!modal) return;
            currentOpenItem = item;
            
            const titleEl = document.getElementById('modalTitle');
            const dynamicStatsEl = document.getElementById('modalDynamicStats');
            titleEl.textContent = item.name;
            titleEl.className = 'text-2xl sm:text-3xl font-serif font-bold mb-2 leading-tight'; 
            dynamicStatsEl.innerHTML = ''; 

            const tags = ['modalLevel', 'modalType', 'modalRarity', 'modalAffinity', 'modalSchool', 'modalLevelDot', 'modalSchoolDot'];
            tags.forEach(t => { if(document.getElementById(t)) document.getElementById(t).classList.add('hidden'); });
            
            ['modalSpellStats', 'modalDescription', 'modalSpellDescription', 'modalPassiveContainer', 'modalSkillContainer'].forEach(id => {
                if(document.getElementById(id)) document.getElementById(id).classList.add('hidden');
            });

            const spellStatScore = charStats[charStats.spellStat] || 10;
            const spellMod = getModifier(spellStatScore);
            const profBonus = getProficiency(charStats.level);
            const spellSaveDC = 8 + profBonus + spellMod;
            const spellAttack = (profBonus + spellMod >= 0) ? `+${profBonus + spellMod}` : `${profBonus + spellMod}`;
            
            const getMeleeAtkBonus = (affinity) => {
                let score = 10;
                switch((affinity || '').toLowerCase()) {
                    case 'strength': score = charStats.str; break;
                    case 'dexterity': score = charStats.dex; break;
                    case 'intelligence': score = charStats.int; break;
                    case 'wisdom': score = charStats.wis; break;
                    case 'charisma': score = charStats.cha; break;
                    default: score = Math.max(charStats.str, charStats.dex);
                }
                const mod = getModifier(score);
                const total = profBonus + mod;
                return total >= 0 ? `+${total}` : `${total}`;

                document.getElementById('modalPassiveTitle').textContent = "Compatibility";
                const passiveEl = document.getElementById('modalPassive');
                
                if (item.compatibility.toLowerCase().includes('unique') && safeWeapons.length > 0) {
                    const matchedWeapon = safeWeapons.find(w => w.skill && w.skill.name === item.name);
                    if (matchedWeapon) {
                        const safeWeaponName = matchedWeapon.name.replace(/'/g, "\\'");
                        passiveEl.innerHTML = `Unique Skill (<span onclick="jumpToWeapon('${safeWeaponName}')" class="text-er-gold hover:text-white underline decoration-er-gold/50 hover:decoration-white underline-offset-4 transition-colors cursor-pointer" title="View Weapon Details">${matchedWeapon.name}</span>)`;
                    } else {
                        passiveEl.textContent = item.compatibility;
                    }
                } else {
                    passiveEl.textContent = item.compatibility;
                }
                document.getElementById('modalPassiveContainer').classList.remove('hidden');

                document.getElementById('modalSkillName').textContent = item.name;
                document.getElementById('modalSkillSp').textContent = `${item.sp} SP`;
                document.getElementById('modalSkillDesc').innerHTML = parseDiceNotation(linkifyText(item.description));
                document.getElementById('modalSkillContainer').classList.remove('hidden');
                
            } else if (currentTab === 'spells') {
                const isSorcery = item.type.toLowerCase() === 'sorcery';
                titleEl.classList.add(isSorcery ? 'text-magic-sorcery' : 'text-magic-incantation');
                
                dynamicStatsEl.innerHTML = `
                    <div class="flex flex-wrap items-center gap-4 text-sm bg-er-panel border border-stone-700 rounded p-2 text-stone-300">
                        <span><strong class="text-stone-500 uppercase tracking-widest text-xs">Save DC:</strong> ${spellSaveDC}</span>
                        <button class="roll-btn" onclick="executeRoll('1d20', '${spellAttack}', 'Spell Attack')" title="Roll Attack">
                            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7.5 18c-.83 0-1.5-.67-1.5-1.5S6.67 15 7.5 15s1.5.67 1.5 1.5S8.33 18 7.5 18zm0-9C6.67 9 6 8.33 6 7.5S6.67 6 7.5 6 9 6.67 9 7.5 8.33 9 7.5 9zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm4.5 4.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm0-9c-.83 0-1.5-.67-1.5-1.5S15.67 6 16.5 6s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
                            Attack: ${spellAttack}
                        </button>
                        <span class="text-stone-500 text-xs italic mt-0.5">(${charStats.spellStat.toUpperCase()})</span>
                    </div>
                `;

                const typeEl = document.getElementById('modalType');
                typeEl.textContent = item.type;
                typeEl.className = `px-2 py-0.5 sm:px-3 sm:py-1 rounded border font-semibold ${isSorcery ? 'text-magic-sorcery border-magic-sorcery/30 bg-er-panel' : 'text-magic-incantation border-magic-incantation/30 bg-er-panel'}`;
                
                const lvlEl = document.getElementById('modalLevel');
                lvlEl.textContent = item.level === 'Cantrip' ? 'Cantrip' : `Level ${item.level}`;
                
                const schEl = document.getElementById('modalSchool');
                schEl.textContent = item.school;
                
                typeEl.classList.remove('hidden');
                lvlEl.classList.remove('hidden');
                schEl.classList.remove('hidden');
                document.getElementById('modalLevelDot').classList.remove('hidden');
                document.getElementById('modalSchoolDot').classList.remove('hidden');

                document.getElementById('modalTime').textContent = item.castingTime;
                document.getElementById('modalRange').textContent = item.range;
                document.getElementById('modalComponents').textContent = item.components;
                document.getElementById('modalDuration').textContent = item.duration;
                document.getElementById('modalSpellStats').classList.remove('hidden');

                document.getElementById('modalSpellDescription').innerHTML = parseDiceNotation(linkifyText(item.description));
                document.getElementById('modalSpellDescription').classList.remove('hidden');
                
            } else if (currentTab === 'wondrous' || currentTab === 'books' || currentTab === 'materials') {
                titleEl.classList.add(currentTab === 'wondrous' ? 'text-er-gold' : item.type === 'Cookbook' ? 'text-orange-400' : currentTab === 'materials' ? 'text-green-400' : 'text-purple-400');
                
                const typeEl = document.getElementById('modalType');
                typeEl.textContent = item.type || 'Material';
                typeEl.className = 'bg-er-panel px-2 py-0.5 sm:px-3 sm:py-1 rounded text-stone-300 border border-stone-700';
                
                const rarEl = document.getElementById('modalRarity');
                rarEl.textContent = item.rarity;
                rarEl.className = `px-2 py-0.5 sm:px-3 sm:py-1 rounded border bg-er-panel font-semibold ${rarityColors[item.rarity] || 'text-stone-300 border-stone-700'}`;
                
                typeEl.classList.remove('hidden');
                rarEl.classList.remove('hidden');
                
                const descEl = document.getElementById('modalDescription');
                let descHtml = parseDiceNotation(linkifyText(item.description));
                
                if (item.recipe) {
                    descHtml += `
                        <div class="mt-4 pt-4 border-t border-er-border">
                            <h4 class="text-er-gold font-serif font-semibold mb-2">Crafting Recipe</h4>
                            <p class="text-stone-300 text-sm leading-relaxed whitespace-pre-wrap">${parseDiceNotation(linkifyText(item.recipe))}</p>
                        </div>
                    `;
                }
                
                descEl.innerHTML = descHtml;
                descEl.classList.remove('hidden');
                
                if (item.effect) {
                    document.getElementById('modalPassiveTitle').textContent = "Effect / Contents";
                    document.getElementById('modalPassive').innerHTML = parseDiceNotation(linkifyText(item.effect));
                    document.getElementById('modalPassiveContainer').classList.remove('hidden');
                }
            }

            modal.classList.remove('hidden');
            // document.body.style.overflow = 'hidden'; // Ensure this doesn't conflict with mobile overlay.
        }
    </script>

</body>
</html>
